# intel_briefs/volt_typhoon_ics_pivot_2025-06-01.yaml
#
# EXAMPLE BRIEF — for documentation and onboarding purposes
# Demonstrates a complete intel brief generated from a CISA advisory
# describing Volt Typhoon TTPs against US critical infrastructure.
#
# This is a representative example. Specific details are drawn from
# publicly available CISA Advisory AA23-144A and related reporting.
# Not operator-provided — generated as reference example.

# ── METADATA ─────────────────────────────────────────────────────────────────
metadata:
  schema_version: "1.0"
  generated_by: INTEL_AGENT
  generated_date: "2025-06-01"
  fidelity: balanced

  source:
    type: cisa_advisory
    title: "People's Republic of China State-Sponsored Cyber Actor Living off the Land to Evade Detection"
    url: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-144a"
    date: "2023-05-24"
    authors: ["CISA", "NSA", "FBI", "ACSC", "CCCS", "NCSC-NZ", "NCSC-UK"]
    tlp: WHITE
    operator_notes: ""

  adversary:
    name: Volt Typhoon
    aliases: ["BRONZE SILHOUETTE", "Vanguard Panda", "DEV-0391"]
    motivation: pre-positioning
    target_sectors: [energy, water, transportation, communications, defense]
    known_tools: ["certutil", "netsh", "wmic", "ntdsutil", "PowerShell",
                  "living-off-the-land binaries (LOLBins)"]
    sophistication: nation_state

# ── LAYER 1: ATTACK SCHEME OF MANEUVER ───────────────────────────────────────
attack_scheme:
  summary: >
    Volt Typhoon gained initial access via exploitation of internet-facing
    network appliances, then used exclusively built-in Windows tooling
    (LOLBins) to avoid detection while conducting extended reconnaissance.
    The adversary demonstrated unusual patience — conducting passive OT
    recon for weeks before any manipulation — and prioritized stealth over
    speed throughout the intrusion chain.

  phases:
    - order: 1
      phase: Initial Access
      tactic_id: TA0001
      technique: T1190
      technique_name: Exploit Public-Facing Application
      ics_technique: false
      adversary_action: >
        Exploited known vulnerabilities in internet-facing network appliances
        (Fortinet FortiGuard, Ivanti Connect Secure, NETGEAR routers).
        No phishing — direct exploitation of unpatched management interfaces.
      why_it_worked: >
        Devices were internet-exposed and unpatched months after CVE disclosure.
        Management interfaces were publicly accessible with no IP allowlisting.
      lab_objective: >
        Student must identify and exploit the exposed boundary service on vmbr2
        using the provided CVE analog. Must demonstrate the exploit, not brute force.
      detection_opportunity: >
        Pre-exploit scanning visible in web server access logs.
        Successful exploit attempt distinguishable from normal traffic pattern.
      detection_artifacts:
        - "nginx access log — unusual URI patterns pre-exploitation"
        - "auth.log — successful login from unexpected source IP"
      fidelity_note: >
        FortiGate/Ivanti not available in lab. Substituted: nginx 1.18
        running CVE-2021-41773 path traversal analog. Technique preserved —
        unauthenticated remote access to boundary device.

    - order: 2
      phase: Persistence
      tactic_id: TA0003
      technique: T1053.005
      technique_name: Scheduled Task/Job — Scheduled Task
      ics_technique: false
      adversary_action: >
        Created scheduled tasks using native Windows schtasks.exe.
        No custom malware or implants dropped at any stage.
        Used wmic.exe, certutil.exe for additional LOLBin persistence.
      why_it_worked: >
        Signature-based EDR did not flag built-in Windows tool usage.
        Scheduled task blended with legitimate admin tasks in the environment.
      lab_objective: >
        Student must establish persistence on the engineering workstation
        using only built-in Windows tools. No Metasploit, no custom
        executables. Task must survive reboot and be discoverable in Event Log.
      detection_opportunity: "Event ID 4698 — scheduled task created"
      detection_artifacts:
        - "Security log: Event ID 4698 (task created)"
        - "Security log: Event ID 4688 (process creation — schtasks.exe)"
        - "System log: Event ID 7045 (new service installed, if applicable)"
      instructor_only: false

    - order: 3
      phase: Defense Evasion
      tactic_id: TA0005
      technique: T1027.013
      technique_name: Obfuscated Files or Information — Encrypted/Encoded File
      ics_technique: false
      adversary_action: >
        Used certutil.exe to encode and decode payloads, avoiding
        dropping recognizable file signatures. All tooling was
        native Windows — no third-party offensive tools observed.
      why_it_worked: "certutil.exe is signed by Microsoft — not flagged by most AV"
      lab_objective: >
        Student must use certutil for payload staging without triggering
        the simulated AV detection rule in the scenario.
      detection_opportunity: >
        Event ID 4688 process creation showing certutil.exe with
        encode/decode arguments is anomalous and detectable.
      detection_artifacts:
        - "Security log: Event ID 4688 — certutil.exe with -encode or -decode args"

    - order: 4
      phase: Discovery
      tactic_id: TA0007
      technique: T1018
      technique_name: Remote System Discovery
      ics_technique: false
      adversary_action: >
        Conducted internal reconnaissance using nltest, net commands,
        and PowerShell to enumerate domain structure, trust relationships,
        and connected network segments before lateral movement.
      why_it_worked: "Built-in tools produced no alerts on the unmonitored IT network"
      lab_objective: >
        Student must enumerate the domain, identify the historian's dual-homed
        adapters, and document the OT subnet before proceeding to pivot.
        Discovery must precede any OT access — graded in sequence.
      detection_opportunity: >
        Unusual LDAP queries, net group commands, and repeated
        nltest calls visible in Windows Security log.
      detection_artifacts:
        - "Security log: Event ID 4661 — sensitive object handle"
        - "Security log: Event ID 4768/4769 — Kerberos ticket requests to new targets"

    - order: 5
      phase: Lateral Movement
      tactic_id: TA0008
      technique: T1021.002
      technique_name: Remote Services — SMB/Windows Admin Shares
      ics_technique: false
      adversary_action: >
        Moved laterally using stolen credentials and SMB admin shares.
        Used wmic for remote execution. Did not use PsExec or
        other third-party lateral movement tools.
      why_it_worked: >
        Legitimate credentials obtained during discovery phase.
        No east-west filtering between IT workstations and server segment.
      lab_objective: >
        Student must pivot from initial access host to engineering workstation
        using harvested credentials and SMB. Must demonstrate the pivot,
        not re-exploit the boundary.
      detection_opportunity: "Event ID 4624 logon type 3 from unexpected source"
      detection_artifacts:
        - "Security log: Event ID 4624 — network logon"
        - "Security log: Event ID 4648 — explicit credential use"
        - "Security log: Event ID 5140 — network share accessed"

    - order: 6
      phase: Collection (ICS)
      tactic_id: TA0009
      technique: T0842
      technique_name: Network Sniffing
      ics_technique: true
      adversary_action: >
        Passively monitored OT network traffic for an extended period
        before any write operations. Read Modbus register map to
        understand the process before acting. Demonstrated patience
        uncommon in less sophisticated adversaries.
      why_it_worked: >
        No anomaly detection on OT network. Passive Modbus reads
        are indistinguishable from legitimate HMI polling.
        No baseline established for comparison.
      lab_objective: >
        Student must capture and analyze OT traffic passively using
        Wireshark or tcpdump. Must document the Modbus register map
        (coil addresses, holding register addresses, observed values)
        BEFORE performing any write operations.
        This objective is explicitly sequenced — graded in order.
      detection_opportunity: >
        Read-only Modbus traffic pattern (FC01, FC03 only) from
        unexpected source IP — distinguishable from normal HMI polling
        by source address. Visible in OT SPAN/TAP if configured.
      detection_artifacts:
        - "OT network capture — FC01/FC03 reads from non-HMI source"
        - "Historian anomaly — new data source without corresponding tag configuration"
      instructor_only: false

    - order: 7
      phase: Impair Process Control
      tactic_id: TA0104
      technique: T0836
      technique_name: Modify Parameter
      ics_technique: true
      adversary_action: >
        Modified process control parameters via Modbus TCP writes
        after extended passive reconnaissance. Changes were targeted
        and process-aware — not random coil toggling.
      why_it_worked: >
        No write protection on Modbus holding registers.
        No process anomaly alerting configured.
        Changes plausible within normal operational variance —
        not immediately detected.
      lab_objective: >
        Student must write to at least one holding register with a
        value outside the safe operating range documented during
        passive recon phase. Must be able to explain the process impact.
      detection_opportunity: >
        Historian data spike outside normal operating range.
        HMI alarm trigger if alarm setpoints configured.
        Modbus write traffic (FC06) in OT network capture.
      detection_artifacts:
        - "Historian InfluxDB — tag value outside normal range"
        - "HMI alarm log — high/low process alarm"
        - "OT network capture — FC06 write from non-HMI source"

  constraints:
    prohibited:
      - "Using Metasploit modules for any phase (Volt Typhoon avoided non-native tooling)"
      - "Dropping custom executables or scripts to disk"
      - "Conducting noisy port scans (adversary prioritized stealth)"
      - "Performing OT writes before completing passive recon phase"
    required_conditions:
      - "Passive OT recon must precede any write operations (graded in sequence)"
      - "All lateral movement must use harvested credentials, not re-exploitation"
      - "Persistence must survive a simulated reboot"

# ── LAYER 2: TOPOLOGY CONTEXT ─────────────────────────────────────────────────
topology_context:
  available_in_source: true

  sector: energy
  subsector: electric_utility
  environment_description: >
    Regional electric utility with corporate IT network connected to
    operational technology (OT) network supporting substation SCADA.
    Engineering workstations on the IT segment had direct protocol
    access to field devices for maintenance purposes. A historian
    server was dual-homed between IT and OT networks.

  critical_topology_facts:
    - "Historian dual-homed between IT and OT — single pivot point with no compensating controls"
    - "Engineering workstation on IT segment with direct Modbus TCP access to PLCs"
    - "No east-west filtering on IT segment — DC reachable from any IT host"
    - "OT network had no IDS/IPS — passive traffic invisible to defenders"
    - "Field devices reachable directly from EWS — no application layer proxy"
    - "Internet-facing management appliance exposed without IP allowlisting"

  what_made_it_vulnerable:
    - condition: "Historian dual-homed without compensating controls"
      enables: "IT→OT pivot without traversing a firewall"
      lab_implementation: >
        Historian VM gets two network adapters:
        vmbr2 (10.10.2.50/24) and vmbr3 (192.168.100.50/24).
        No firewall between adapters — same as source environment.

    - condition: "EWS has direct Modbus TCP access to PLC"
      enables: "OT process manipulation from compromised IT host"
      lab_implementation: >
        pfSense PERMIT TCP/502 from 10.10.2.30 (EWS) to
        192.168.100.10 (OpenPLC). This is a legitimate business rule,
        not a misconfiguration — students must understand this distinction.
      is_misconfiguration: false

    - condition: "No east-west filtering on IT segment"
      enables: "Lateral movement via PTH without firewall traversal"
      lab_implementation: >
        DC (10.10.2.20) and EWS (10.10.2.30) both on vmbr2.
        No ACL between them. Historian also on vmbr2 IT adapter.

    - condition: "No OT network monitoring"
      enables: "Passive reconnaissance invisible to defenders"
      lab_implementation: >
        No IDS on vmbr3. Modbus reads generate no alerts.
        Blue team scenario variant can add SPAN port to historian
        and pre-stage NetFlow data for detection exercise.

  network_zones_present: [corporate_IT, OT_SCADA, internet_boundary]

  lab_zone_mapping:
    - source_zone: internet_boundary
      lab_bridge: vmbr2
      ip_range: "10.10.2.0/24"
      notes: "Boundary nginx VM on vmbr2 represents internet-facing appliance"
    - source_zone: corporate_IT
      lab_bridge: vmbr2
      ip_range: "10.10.2.0/24"
      notes: "IT segment — attacker, EWS, DC, historian IT adapter all here"
    - source_zone: OT_SCADA
      lab_bridge: vmbr3
      ip_range: "192.168.100.0/24"
      notes: "OT segment — historian OT adapter, OpenPLC"

  topology_requirements:
    - requirement: "Historian must be dual-homed IT and OT"
      implements_as:
        type: vm_dual_home
        detail: >
          Historian VM: adapter 0 on vmbr2 (10.10.2.50/24),
          adapter 1 on vmbr3 (192.168.100.50/24).
          Set in Terraform vm config, both adapters active.
      rationale: "Sole IT→OT pivot path per source"
      is_misconfiguration: false

    - requirement: "EWS Modbus access to PLC — no firewall"
      implements_as:
        type: pfSense_rule
        detail: "PERMIT TCP 10.10.2.30 → 192.168.100.10 port 502"
      rationale: "Legitimate maintenance access abused by adversary"
      is_misconfiguration: false

    - requirement: "Exposed boundary service on IT segment"
      implements_as:
        type: vm_config
        detail: "nginx VM on vmbr2 at 10.10.2.5, port 80/443 accessible from attacker"
      rationale: "Represents internet-facing appliance entry vector"
      is_misconfiguration: true

# ── LAYER 3: INFRASTRUCTURE INVENTORY ────────────────────────────────────────

---
# ansible/roles/wazuh-agent-linux/tasks/main.yml

- name: "[WAZUH-AGENT] Install apt prerequisites"
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
      - apt-transport-https
      - ca-certificates
    state: present
    update_cache: true

- name: "[WAZUH-AGENT] Fetch Wazuh package signing key"
  ansible.builtin.get_url:
    url: "{{ wazuh_agent_gpg_key_url }}"
    dest: /tmp/wazuh-key.asc
    mode: "0644"
    force: false

- name: "[WAZUH-AGENT] Install signing key into apt keyring"
  ansible.builtin.shell:
    cmd: >
      gpg --no-default-keyring
          --keyring {{ wazuh_agent_gpg_key_path }}
          --import /tmp/wazuh-key.asc
      && chmod 0644 {{ wazuh_agent_gpg_key_path }}
    creates: "{{ wazuh_agent_gpg_key_path }}"

- name: "[WAZUH-AGENT] Add Wazuh apt repository"
  ansible.builtin.apt_repository:
    repo: "{{ wazuh_agent_repo }}"
    filename: wazuh
    state: present
    update_cache: true

- name: "[WAZUH-AGENT] Install wazuh-agent package"
  ansible.builtin.apt:
    name: "wazuh-agent={{ wazuh_agent_version }}"
    state: present
  environment:
    # Picked up by the debconf hook in the wazuh-agent .deb so the agent
    # comes up with the right manager baked in even before ossec.conf is templated.
    WAZUH_MANAGER: "{{ wazuh_manager_address }}"
    WAZUH_REGISTRATION_SERVER: "{{ wazuh_manager_address }}"
    WAZUH_AGENT_GROUP: "{{ wazuh_agent_groups | join(',') }}"
  register: wazuh_agent_install

- name: "[WAZUH-AGENT] Hold wazuh-agent to prevent accidental upgrade across the 4.9 line"
  ansible.builtin.dpkg_selections:
    name: wazuh-agent
    selection: hold

- name: "[WAZUH-AGENT] Template ossec.conf with manager + group configuration"
  ansible.builtin.template:
    src: ossec.conf.j2
    dest: /var/ossec/etc/ossec.conf
    owner: root
    group: wazuh
    mode: "0640"
  notify: restart_wazuh_agent

- name: "[WAZUH-AGENT] Remove stale client.keys before re-registration (overwrite mode)"
  ansible.builtin.file:
    path: /var/ossec/etc/client.keys
    state: absent
  when:
    - wazuh_agent_auth_overwrite | bool
    - wazuh_agent_install.changed

- name: "[WAZUH-AGENT] Register agent with manager via agent-auth"
  ansible.builtin.command:
    cmd: >
      /var/ossec/bin/agent-auth
        -m {{ wazuh_manager_address }}
        -p {{ wazuh_agent_enrollment_port }}
        -G {{ wazuh_agent_groups | join(',') }}
    creates: /var/ossec/etc/client.keys
  notify: restart_wazuh_agent

- name: "[WAZUH-AGENT] Enable and start wazuh-agent service"
  ansible.builtin.systemd:
    name: wazuh-agent
    state: started
    enabled: true
    daemon_reload: true

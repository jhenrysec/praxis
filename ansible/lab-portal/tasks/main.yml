# ansible/roles/lab-portal/tasks/main.yml
# Deploys portal-backend (PM2) and portal-ui (nginx) on the management host
# Generated by: INFRA_AGENT during /portal-build Phase 17
# Updated: see CHANGELOG.md

---
- name: "[PORTAL] Install Node.js 22 via NodeSource"
  ansible.builtin.shell: |
    curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    apt install -y nodejs
  args:
    creates: /usr/bin/node

- name: "[PORTAL] Install PM2 globally"
  community.general.npm:
    name: pm2
    global: true
    state: present

- name: "[PORTAL] Install nginx"
  ansible.builtin.apt:
    name: nginx
    state: present

- name: "[PORTAL] Install portal-backend dependencies"
  community.general.npm:
    path: "{{ repo_root }}/portal-backend"
    state: present

- name: "[PORTAL] Build portal-backend TypeScript"
  ansible.builtin.command:
    cmd: npm run build
    chdir: "{{ repo_root }}/portal-backend"
  register: backend_build
  changed_when: "'successfully' in backend_build.stdout"

- name: "[PORTAL] Run database migrations"
  ansible.builtin.command:
    cmd: npm run migrate
    chdir: "{{ repo_root }}/portal-backend"
  environment:
    DATABASE_URL: "{{ db_url }}"
  register: migrate_result
  changed_when: "'Migrating' in migrate_result.stdout"

- name: "[PORTAL] Run database seed (first run only)"
  ansible.builtin.command:
    cmd: npm run seed
    chdir: "{{ repo_root }}/portal-backend"
  environment:
    DATABASE_URL: "{{ db_url }}"
    ADMIN_PASSWORD: "{{ admin_password }}"
  register: seed_result
  # Only seed if admin user doesn't exist
  changed_when: "'Seed complete' in seed_result.stdout"
  failed_when: seed_result.rc != 0 and 'already exists' not in seed_result.stderr

- name: "[PORTAL] Write .env file for portal-backend"
  ansible.builtin.template:
    src: portal-backend.env.j2
    dest: "{{ repo_root }}/portal-backend/.env"
    mode: '0600'
  no_log: true
  notify: restart_portal_backend

- name: "[PORTAL] Write PM2 ecosystem config"
  ansible.builtin.template:
    src: ecosystem.config.js.j2
    dest: "{{ repo_root }}/portal-backend/ecosystem.config.js"
    mode: '0644'
  notify: restart_portal_backend

- name: "[PORTAL] Start portal-backend with PM2"
  ansible.builtin.command:
    cmd: pm2 start ecosystem.config.js --env production
    chdir: "{{ repo_root }}/portal-backend"
  register: pm2_start
  changed_when: "'online' in pm2_start.stdout"
  ignore_errors: true

- name: "[PORTAL] Save PM2 process list"
  ansible.builtin.command:
    cmd: pm2 save
  changed_when: false

- name: "[PORTAL] Configure PM2 startup on boot"
  ansible.builtin.command:
    cmd: pm2 startup systemd -u root --hp /root
  register: pm2_startup
  changed_when: pm2_startup.rc == 0

- name: "[PORTAL] Build portal-ui"
  community.general.npm:
    path: "{{ repo_root }}/portal-ui"
    state: present

- name: "[PORTAL] Build portal-ui production bundle"
  ansible.builtin.command:
    cmd: npm run build
    chdir: "{{ repo_root }}/portal-ui"
  register: ui_build
  changed_when: "'built in' in ui_build.stdout"

- name: "[PORTAL] Write nginx configuration"
  ansible.builtin.template:
    src: nginx-portal.conf.j2
    dest: /etc/nginx/sites-available/portal
    mode: '0644'
  notify: reload_nginx

- name: "[PORTAL] Enable nginx site"
  ansible.builtin.file:
    src: /etc/nginx/sites-available/portal
    dest: /etc/nginx/sites-enabled/portal
    state: link
  notify: reload_nginx

- name: "[PORTAL] Remove default nginx site"
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload_nginx

- name: "[PORTAL] Verify portal-backend is responding"
  ansible.builtin.uri:
    url: http://localhost:4000/api/health
    status_code: 200
  register: health_check
  retries: 10
  delay: 3
  until: health_check.status == 200

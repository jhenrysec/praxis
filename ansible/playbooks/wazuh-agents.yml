---
# ansible/playbooks/wazuh-agents.yml
# Installs Wazuh agents on all scenario VMs, routing each host to the
# correct OS-specific role. Called after a scenario's terraform apply
# and before (or in parallel with) scenario-specific Ansible playbooks.
#
# Inventory contract (generated by scripts/build):
#   [linux]     — Linux hosts (Kali attackers, Ubuntu victims, OpenPLC, etc.)
#   [windows]   — Windows hosts (DCs, workstations, servers)
# Hostvars must include:
#   slot_number  — 1..20, used to derive the slot-NN group
#   zone_tag     — red | blue | ot, used as an agent group
#
# Usage:
#   ansible-playbook -i inventories/slot-01.ini playbooks/wazuh-agents.yml

- name: "Install Wazuh agent on Linux hosts"
  hosts: linux
  become: true
  gather_facts: true
  vars:
    wazuh_agent_groups:
      - "slot-{{ '%02d' | format(slot_number | int) }}"
      - "{{ zone_tag }}"
      - "linux"
  roles:
    - wazuh-agent-linux

- name: "Install Wazuh agent on Windows hosts"
  hosts: windows
  gather_facts: true
  vars:
    wazuh_agent_groups:
      - "slot-{{ '%02d' | format(slot_number | int) }}"
      - "{{ zone_tag }}"
      - "windows"
  roles:
    - wazuh-agent-windows

# ── LAYER 4: IOC AND ARTIFACT CATALOG ────────────────────────────────────────
ioc_catalog:
  available_in_source: true

  artifacts:
    - id: IOC-001
      type: scheduled_task
      host_role: engineering_workstation
      description: >
        Scheduled task created via schtasks.exe using LOLBin pattern.
        Represents Volt Typhoon persistence mechanism.
      source_detail: "Event ID 4698, task name resembles legitimate system task"

      staging:
        method: ansible_task
        ansible_role: stage-windows-artifacts
        file_path: "Windows Task Scheduler — not a file"
        file_source: "artifacts/volt_typhoon/event_4698_template.xml"
        pre_scenario: true

      detection_value: >
        Tests ability to identify suspicious scheduled tasks in
        Task Scheduler and correlate with Event ID 4698 in Security log.
      intentional: false
      difficulty: medium
      hint_available: true

    - id: IOC-002
      type: windows_event
      host_role: engineering_workstation
      description: >
        Process creation events for LOLBin usage:
        certutil.exe with -encode argument, wmic.exe with remote query.
        Pre-staged in Security log as Event ID 4688 entries.
      source_detail: "Event ID 4688 — certutil.exe, wmic.exe, net.exe"

      staging:
        method: ansible_task
        ansible_role: stage-windows-artifacts
        file_path: "Windows Event Log — Security channel"
        file_source: "artifacts/volt_typhoon/event_4688_sequence.evtx"
        pre_scenario: true

      detection_value: >
        Tests ability to identify LOLBin usage pattern in process
        creation logs. Key skill: distinguishing malicious certutil
        usage from legitimate admin use.
      intentional: false
      difficulty: hard

    - id: IOC-003
      type: network_pcap
      host_role: analyst_vm
      description: >
        Pre-captured PCAP showing passive Modbus read sequence
        (FC01 and FC03 only) from unexpected source IP over a
        simulated 72-hour window compressed to representative sample.
        Placed on analyst VM for forensic analysis track.
      source_detail: "Passive Modbus reconnaissance — FC01/FC03 only, no writes"

      staging:
        method: file_drop
        ansible_role: stage-pcap-artifacts
        file_path: "/home/analyst/artifacts/capture_2024-03-15.pcap"
        file_source: "artifacts/volt_typhoon/modbus_passive_recon.pcap"
        pre_scenario: true

      detection_value: >
        Tests Wireshark/Modbus protocol analysis skills.
        Students must identify: source IP, FC codes used,
        register addresses read, absence of write operations.
        Key learning: passive recon precedes active manipulation.
      intentional: false
      difficulty: medium

    - id: IOC-004
      type: filesystem_artifact
      host_role: engineering_workstation
      description: >
        Encoded payload staged in Temp directory via certutil.
        Represents intermediate stage of LOLBin execution chain.
      source_detail: "certutil.exe -encode output in C:\\Windows\\Temp\\"

      staging:
        method: file_drop
        ansible_role: stage-windows-artifacts
        file_path: "C:\\Windows\\Temp\\svc_config_update.b64"
        file_source: "artifacts/volt_typhoon/encoded_payload.b64"
        pre_scenario: true

      detection_value: >
        Tests filesystem forensics — finding non-standard file
        in Temp directory. Tests understanding of certutil encoding
        and ability to decode and analyze content.
      intentional: false
      difficulty: easy

    - id: IOC-005
      type: log_entry
      host_role: historian
      description: >
        Unexpected outbound connection attempts in syslog from
        historian's OT-side adapter — suggests adversary discovered
        the dual-homed host and attempted to use it as pivot.
      source_detail: "Syslog entries showing lateral connection attempts"

      staging:
        method: ansible_task
        ansible_role: stage-linux-artifacts
        file_path: "/var/log/syslog"
        file_source: "artifacts/volt_typhoon/historian_syslog_inject.txt"
        pre_scenario: true

      detection_value: >
        Tests ability to find pivot evidence on dual-homed Linux host.
        Students must correlate syslog connection attempts with
        timeline of Windows lateral movement events.
      intentional: false
      difficulty: hard

  raw_iocs:
    ip_addresses: []
    domains: []
    file_hashes: []
    file_names:
      - "svc_config_update.b64"
      - "update_check.bat"
    registry_keys:

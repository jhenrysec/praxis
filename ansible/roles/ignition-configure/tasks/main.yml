---
# ansible/roles/ignition-configure/tasks/main.yml
# Configures Ignition Gateway: starts service, waits for readiness,
# accepts trial license, configures tags and OPC-UA connections.

- name: "[IGNITION] Ensure Ignition service is started"
  ansible.builtin.systemd:
    name: ignition
    state: started
    enabled: true

- name: "[IGNITION] Wait for Ignition Gateway web interface"
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ ignition_web_port }}/StatusPing"
    status_code: 200
    return_content: true
  register: ignition_ready
  retries: 30
  delay: 10
  until: ignition_ready.status == 200

- name: "[IGNITION] Check if initial setup is needed"
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ ignition_web_port }}/post-step"
    method: GET
    status_code: [200, 302, 404]
  register: ignition_setup_check
  ignore_errors: true

- name: "[IGNITION] Accept EULA (first-time setup)"
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ ignition_web_port }}/post-step"
    method: POST
    body_format: form-urlencoded
    body:
      id: license
      step: eula
      accept: "true"
    status_code: [200, 302]
  when: ignition_setup_check.status == 200
  ignore_errors: true

- name: "[IGNITION] Set admin credentials (first-time setup)"
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ ignition_web_port }}/post-step"
    method: POST
    body_format: form-urlencoded
    body:
      id: authentication
      step: createuser
      username: "{{ ignition_admin_user }}"
      password: "{{ ignition_admin_password }}"
    status_code: [200, 302]
  when: ignition_setup_check.status == 200
  no_log: true
  ignore_errors: true

- name: "[IGNITION] Select trial edition (first-time setup)"
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ ignition_web_port }}/post-step"
    method: POST
    body_format: form-urlencoded
    body:
      id: edition
      step: edition
      edition: "trial"
    status_code: [200, 302]
  when: ignition_setup_check.status == 200
  ignore_errors: true

- name: "[IGNITION] Finish setup (first-time setup)"
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ ignition_web_port }}/post-step"
    method: POST
    body_format: form-urlencoded
    body:
      id: finalize
      step: finalize
    status_code: [200, 302]
  when: ignition_setup_check.status == 200
  ignore_errors: true

- name: "[IGNITION] Wait for Gateway to fully initialize after setup"
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ ignition_web_port }}/StatusPing"
    status_code: 200
  register: ignition_post_setup
  retries: 20
  delay: 10
  until: ignition_post_setup.status == 200

- name: "[IGNITION] Verify OPC-UA port is listening"
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ ignition_opcua_port }}"
    timeout: 60
    msg: "OPC-UA port {{ ignition_opcua_port }} not responding on {{ ansible_host }}"
  ignore_errors: true

- name: "[IGNITION] Display Gateway status"
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ ignition_web_port }}/StatusPing"
    return_content: true
  register: ignition_status
  changed_when: false

- name: "[IGNITION] Report status"
  ansible.builtin.debug:
    msg: "Ignition Gateway running at http://{{ ansible_host }}:{{ ignition_web_port }} — {{ ignition_status.content | default('status unknown') }}"

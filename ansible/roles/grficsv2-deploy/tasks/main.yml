---
# ansible/roles/grficsv2-deploy/tasks/main.yml
# Deploy GRFICSv2 chemical plant simulator as Docker containers.
# Requires: Docker Engine and Docker Compose v2 installed on the target host.

- name: "[GRFICS] Install Docker prerequisites"
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: "[GRFICS] Add Docker GPG key"
  ansible.builtin.shell: |
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
    chmod a+r /etc/apt/keyrings/docker.asc
  args:
    creates: /etc/apt/keyrings/docker.asc

- name: "[GRFICS] Add Docker repository"
  ansible.builtin.shell: |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] \
      https://download.docker.com/linux/debian $(. /etc/os-release && echo $VERSION_CODENAME) stable" \
      > /etc/apt/sources.list.d/docker.list
  args:
    creates: /etc/apt/sources.list.d/docker.list

- name: "[GRFICS] Install Docker Engine"
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: "[GRFICS] Enable and start Docker"
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: "[GRFICS] Create install directory"
  ansible.builtin.file:
    path: "{{ grficsv2_install_dir }}"
    state: directory
    mode: "0755"

- name: "[GRFICS] Deploy docker-compose.yml"
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ grficsv2_install_dir }}/docker-compose.yml"
    mode: "0644"
  notify: restart_grficsv2

- name: "[GRFICS] Pull container images"
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ grficsv2_install_dir }}"
  register: grfics_pull
  changed_when: "'Pull complete' in grfics_pull.stdout or 'Downloaded' in grfics_pull.stdout"

- name: "[GRFICS] Start GRFICSv2 stack"
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ grficsv2_install_dir }}"
  register: grfics_up
  changed_when: "'Started' in grfics_up.stderr or 'Creating' in grfics_up.stderr"

- name: "[GRFICS] Wait for PLC Modbus TCP (port {{ grficsv2_plc_modbus_port }})"
  ansible.builtin.wait_for:
    host: "{{ grficsv2_plc_ip }}"
    port: "{{ grficsv2_plc_modbus_port }}"
    timeout: 60
    msg: "GRFICSv2 PLC Modbus port not responding on {{ grficsv2_plc_ip }}:{{ grficsv2_plc_modbus_port }}"

- name: "[GRFICS] Wait for HMI web interface (port {{ grficsv2_hmi_web_port }})"
  ansible.builtin.wait_for:
    host: "{{ grficsv2_hmi_ip }}"
    port: "{{ grficsv2_hmi_web_port }}"
    timeout: 60
    msg: "GRFICSv2 HMI web port not responding on {{ grficsv2_hmi_ip }}:{{ grficsv2_hmi_web_port }}"

- name: "[GRFICS] Verify containers are running"
  ansible.builtin.command:
    cmd: docker compose ps --format json
    chdir: "{{ grficsv2_install_dir }}"
  register: grfics_status
  changed_when: false

- name: "[GRFICS] Display container status"
  ansible.builtin.debug:
    msg: |
      GRFICSv2 stack deployed:
        PLC Modbus:  {{ grficsv2_plc_ip }}:{{ grficsv2_plc_modbus_port }}
        HMI Web:     http://{{ grficsv2_hmi_ip }}:{{ grficsv2_hmi_web_port }}
        HMI VNC:     {{ grficsv2_hmi_ip }}:{{ grficsv2_hmi_vnc_port }}
        Simulation:  {{ grficsv2_simulation_ip }} (internal process sim)

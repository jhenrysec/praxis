---
# ansible/playbooks/lateral-movement.yml
# Scenario: SCEN-003 — APT Lateral Movement
# Purpose: Full post-deploy configuration for all 4 VMs
# Updated: 2026-04-07
#
# Usage:
#   ansible-playbook -i ../inventory/hosts.ini playbooks/lateral-movement.yml
#
# Hosts expected in inventory:
#   [attackers]            — kali-attacker
#   [domain_controllers]   — dc01 (Windows Server 2022)
#   [workstations]         — ws01, ws02 (Windows Server 2022)
#   [vulnerable]           — all Windows hosts (vulns applied to DCs + workstations)

- name: "SCEN-003 — Configure Linux base on attacker"
  hosts: attackers
  become: true
  roles:
    - role: ../../../../ansible/roles/common-linux

- name: "SCEN-003 — Configure Windows base on all Windows hosts"
  hosts: windows
  roles:
    - role: ../../../../ansible/roles/common-windows

- name: "SCEN-003 — Promote domain controller"
  hosts: domain_controllers
  roles:
    - role: ../../../../ansible/roles/ad-domain-controller

- name: "SCEN-003 — Join workstations to domain"
  hosts: workstations
  roles:
    - role: ../../../../ansible/roles/ad-member-workstation

- name: "SCEN-003 — Apply intentional vulnerabilities"
  hosts: vulnerable
  roles:
    - role: ../../../../ansible/roles/vulnerable-services

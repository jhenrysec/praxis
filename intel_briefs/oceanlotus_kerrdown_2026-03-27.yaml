# ── LAYER 5: OPERATIONAL CONTEXT AND DRESSING ────────────────────────────────
operational_context:
  sector: government
  subsector: ""
  org_type: "Vietnamese government ministry or civil society organization"

  environment_narrative: >
    A mid-size Vietnamese government agency operates a Windows Active
    Directory domain for staff workstations. Staff regularly receive
    and open Office documents via email as part of normal operations.
    The organization processes citizen complaints and correspondence,
    making document-based lures contextually plausible. The IT
    department enforces basic security (antivirus, Windows updates)
    but has not deployed application whitelisting, advanced endpoint
    detection, or network traffic analysis capabilities.

  regulatory_context:
    - "Vietnamese Law on Cybersecurity (2018)"
    - "Government information security policies"

  scenario_brief_for_students: >
    You are a SOC analyst at a regional government agency in Southeast
    Asia. Your security team received an alert from the email gateway
    flagging a suspicious attachment sent to a senior staff member.
    The attachment is a Word document with Vietnamese-language content.
    A second alert from the endpoint shows a process creation event
    from WINWORD.EXE that doesn't match normal user behavior. Your
    mission: analyze the delivery mechanism, trace the full infection
    chain from document to C2 callback, identify the final payload,
    and produce a technical incident report mapped to MITRE ATT&CK.
    You have access to the victim workstation, network captures, and
    a memory dump. You are authorized to use any analysis tools on
    your analyst workstation.

  instructor_notes: >
    This scenario has two parallel tracks:

    RED TEAM TRACK: Students use the Kali attacker VM to replicate
    the OceanLotus delivery chain. They craft a macro-enabled document
    with embedded base64 payload, set up the DLL sideloading package,
    configure a Cobalt Strike listener, and deliver the payload to the
    workstation. Graded on: correct DLL sideloading implementation,
    in-memory-only execution, and C2 establishment.

    BLUE TEAM / FORENSICS TRACK: Students receive the pre-staged
    artifacts (lure doc on desktop, Sysmon logs, PCAP, memory dump)
    and must reconstruct the full attack chain through analysis.
    Graded on: correct identification of all six ATT&CK techniques,
    extraction of IOCs from artifacts, and quality of the incident
    report.

    The custom User-Agent string is a key detection point. The
    legitimate Firefox UA uses "Win64; x64" but the KerrDown
    32-bit variant uses "Win32; x32" — the real Firefox string
    would be "WOW64" on a 32-bit app running on 64-bit Windows.
    Students who catch this anomaly in the PCAP demonstrate
    strong network analysis skills.

    IOC-006 (memory dump) is the hardest artifact. Reserve hints
    for students who have completed objectives 1-4 and are stuck
    on Beacon extraction. Volatility's cobalt strike scanner plugin
    simplifies this significantly.

  dressing_assets:
    - id: DRESS-001
      host_role: victim_workstation
      type: document
      filename: "Huong_dan_xu_ly_don_khieu_nai_2024.docx"
      file_path: "C:\\Users\\labuser\\Documents\\Huong_dan_xu_ly_don_khieu_nai_2024.docx"
      format: docx
      content_brief: >
        A 4-page Vietnamese-language guide on processing citizen
        complaint letters. Title: "Huong dan xu ly don khieu nai"
        (Guide to Processing Complaint Letters). Official-looking
        letterhead for "So Noi Vu" (Department of Internal Affairs).
        Contains a table of complaint categories, processing
        timelines, and required documentation. References Vietnamese
        administrative law. This document establishes the context
        for why the lure document (a complaint letter) would be
        contextually relevant to the victim.
      sector_references:
        - "Vietnamese administrative law terminology"
        - "Government complaint processing procedures"
        - "Vietnamese-language document formatting"
      training_purpose: context
      generates_via: docx_skill
      ansible_task: "stage-dressing-ews"

    - id: DRESS-002
      host_role: victim_workstation
      type: document
      filename: "Danh_sach_nhan_vien_2024.xlsx"
      file_path: "C:\\Users\\labuser\\Desktop\\Danh_sach_nhan_vien_2024.xlsx"
      format: xlsx
      content_brief: >
        Staff directory spreadsheet for a Vietnamese government
        department. Columns: Ho ten (Full name), Chuc vu (Position),
        Phong ban (Department), Email, So dien thoai (Phone).
        20 rows of realistic Vietnamese names with government
        positions. The victim user "Nguyen Van Minh" appears as
        "Chuyen vien" (Specialist) in the "Phong Tiep dan"
        (Citizen Reception Department). This establishes why the
        victim would receive complaint-related documents.
      sector_references:
        - "Vietnamese government organizational structure"
        - "Vietnamese naming conventions"
      training_purpose: context
      generates_via: xlsx_skill
      ansible_task: "stage-dressing-ews"

    - id: DRESS-003
      host_role: victim_workstation
      type: email
      filename: "email_thread_complaint.msg"
      file_path: "C:\\Users\\labuser\\Desktop\\email_thread_complaint.msg"
      format: txt
      content_brief: >
        A simulated email thread (plain text) between the victim
        and a colleague discussing an incoming batch of citizen
        complaints. The colleague mentions forwarding a document
        "for review" — establishing the social engineering pretext
        for why the victim would open an attachment from what
        appears to be an internal source. The forwarding colleague's
        name matches an entry in the staff directory (DRESS-002).
        Red herring: the colleague is not compromised, the lure
        arrived via a spoofed email address.
      sector_references:
        - "Vietnamese business email conventions"
      training_purpose: red_herring
      generates_via: manual
      ansible_task: "stage-dressing-ews"

    - id: DRESS-004
      host_role: victim_workstation
      type: config_file
      filename: "Sysmon_config.xml"
      file_path: "C:\\ProgramData\\Sysmon\\config.xml"
      format: xml
      content_brief: >
        SwiftOnSecurity Sysmon configuration file. This is not
        a dressing asset per se — it is the detection infrastructure
        that produces the forensic artifacts students analyze.
        Configured to log: process creation (Event 1), file creation
        (Event 11), registry events (Event 12-14), network connections
        (Event 3), DLL loads (Event 7), named pipes (Event 17/18).
      sector_references: []
      training_purpose: baseline
      generates_via: manual
      ansible_task: "windows-sysmon-config"


# Debian/Kali preseed — fully automated install for Packer templates
# Used by: kali-2024.pkr.hcl, debian-12.pkr.hcl, openplc.pkr.hcl, ignition-dev.pkr.hcl

# ── Locale & Keyboard ───────────────────────────────────────────────────────
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i console-keymaps-at/keymap select us

# ── Network ──────────────────────────────────────────────────────────────────
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string template
d-i netcfg/get_domain string lab.local
# Suppress missing firmware prompts
d-i hw-detect/load_firmware boolean false

# ── Mirror (Debian/Kali) ────────────────────────────────────────────────────
d-i mirror/country string manual
d-i mirror/http/hostname string http.kali.org
d-i mirror/http/directory string /kali
d-i mirror/http/proxy string
# Accept unsigned repos (Kali archive key changes between releases)
d-i debian-installer/allow_unauthenticated boolean true
apt-setup-udeb apt-setup/services-select multiselect

# ── Clock ────────────────────────────────────────────────────────────────────
d-i clock-setup/utc boolean true
d-i time/zone string America/New_York
d-i clock-setup/ntp boolean true

# ── Partitioning ─────────────────────────────────────────────────────────────
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/disk string /dev/sda
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true

# ── User Account ─────────────────────────────────────────────────────────────
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Lab User
d-i passwd/username string labuser
# Plain-text password — lab environment only, changed by Ansible post-deploy
d-i passwd/user-password string labuser
d-i passwd/user-password-again string labuser
# Suppress weak password warning
d-i user-setup/allow-password-weak boolean true

# ── Package Selection ────────────────────────────────────────────────────────
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-server sudo python3 curl wget ca-certificates gnupg qemu-guest-agent
d-i pkgsel/upgrade select full-upgrade
# Prevent popularity-contest prompt
popularity-contest popularity-contest/participate boolean false

# ── Bootloader ───────────────────────────────────────────────────────────────
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default
d-i grub-installer/with_other_os boolean false

# ── Post-install ─────────────────────────────────────────────────────────────
d-i preseed/late_command string \
  in-target sh -c 'echo "labuser ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/labuser'; \
  in-target chmod 440 /etc/sudoers.d/labuser; \
  in-target systemctl enable ssh; \
  in-target systemctl enable qemu-guest-agent

# ── Finish ───────────────────────────────────────────────────────────────────
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true

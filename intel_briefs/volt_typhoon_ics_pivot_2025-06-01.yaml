# ── LAYER 5: OPERATIONAL CONTEXT AND DRESSING ────────────────────────────────
operational_context:
  sector: energy
  subsector: electric_utility
  org_type: "Regional electric transmission cooperative"

  environment_narrative: >
    Tri-County Electric Cooperative operates a regional transmission network
    serving three rural counties. The cooperative's engineering team uses
    an EWS to perform remote maintenance on substation SCADA systems.
    Process data is aggregated by a historian server and displayed on
    dashboards accessible to operations staff on the IT network.
    The cooperative has limited cybersecurity staffing and relies
    on perimeter defenses that have not been reviewed in 18 months.

  regulatory_context:
    - "NERC CIP (CIP-002 through CIP-011) — applicable to BES Cyber Systems"
    - "NERC CIP-007-6 — Systems Security Management (patch management)"
    - "NERC CIP-013-1 — Supply Chain Risk Management"

  scenario_brief_for_students: >
    You are a CISA threat hunter responding to a tip that a nation-state
    actor has pre-positioned access inside a regional electric cooperative's
    network. The cooperative's MSSP flagged unusual scheduled task creation
    on an engineering workstation two weeks ago but the alert was not
    investigated. Your mission: determine the initial access vector,
    reconstruct the full intrusion chain, identify any OT access or
    manipulation, and produce a findings report mapped to MITRE ATT&CK.
    You have read access to the cooperative's network. You are not
    authorized to modify any systems — this is a hunt/forensics exercise.

  instructor_notes: >
    The network diagram (DRESS-004) on the EWS desktop reveals the full
    topology including the historian's dual-homed status — this is intentional.
    Real environments have these documents. Students who enumerate thoroughly
    find it and work faster. Do not penalize for using it.
    
    DRESS-003 (vendor access request) is a deliberate red herring.
    The vendor had legitimate access scheduled but did not execute the intrusion.
    Students who pursue the vendor lead are learning to evaluate and eliminate
    hypotheses — acceptable behavior, note it in the debrief.
    
    IOC-005 (historian syslog) is the hardest artifact to find. Reserve the
    hint for teams that have completed all other objectives and are stuck.
    
    The OpenPLC register map in the SOP document (DRESS-001) is the same
    register map used in the actual OpenPLC scenario configuration — students
    who read the document before touching Modbus have a significant advantage.
    This rewards preparation and document review, as in real incidents.
    
    Strict fidelity note: In the real incident, adversaries conducted passive
    recon for weeks. In the 4-6 hour lab, the passive recon phase should take
    30-45 minutes minimum. Enforce sequencing — a student who skips straight
    to Modbus writes without documenting the register map from passive capture
    has not demonstrated the technique the scenario is teaching.

  dressing_assets:

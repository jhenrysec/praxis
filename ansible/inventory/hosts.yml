---
# ansible/inventory/hosts.yml
# Static inventory for lab-wide fixtures (Proxmox host, shared SIEM, etc.).
# Per-slot scenario inventories are generated by `scripts/build` into
# inventory/slot-NN.ini and used alongside this file.
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml playbooks/proxmox-bridges.yml
#   ansible-playbook -i inventory/hosts.yml playbooks/wazuh-shared.yml

all:
  vars:
    ansible_ssh_private_key_file: ~/.ssh/lab_key
    ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"

  children:

    # Proxmox hypervisor host. Network-bridge management and other
    # host-level tasks (proxmox-bridge role) target this group.
    proxmox:
      hosts:
        pve01:
          ansible_host: 192.168.1.50
          ansible_user: root
          ansible_python_interpreter: /usr/bin/python3

    # Shared Wazuh all-in-one fixture. Ubuntu 24.04, reached via vmbr0.
    # The same VM is dual-homed on vmbr4 (192.168.4.10) for agent traffic;
    # Ansible management continues to use the vmbr0 address.
    wazuh_shared:
      hosts:
        wazuh-shared:
          ansible_host: 192.168.1.60
          ansible_user: ansible
          ansible_python_interpreter: /usr/bin/python3

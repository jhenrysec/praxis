          SEL Fast Message protocol not emulated.
          Modbus TCP register behavior preserved.
        fidelity_note: >
          Physical SEL hardware not feasible in VM lab.
          OpenPLC provides identical Modbus TCP attack surface.
          Register map configured to match typical RTAC layout.
        licensing_constraint: false

      vm_config:
        cpu_cores: 2

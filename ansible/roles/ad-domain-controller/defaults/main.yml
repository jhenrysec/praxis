---
# ad-domain-controller defaults
ad_domain_name: "lab.local"
ad_netbios_name: "LAB"
ad_dsrm_password: "{{ vault_ad_dsrm_password | default('DSRMPass2024!@#') }}"

ad_domain_functional_level: "WinThreshold"
ad_forest_functional_level: "WinThreshold"

# OU structure
ad_ous:
  - { name: "Lab Users", path: "DC=lab,DC=local" }
  - { name: "Lab Computers", path: "DC=lab,DC=local" }
  - { name: "Service Accounts", path: "DC=lab,DC=local" }
  - { name: "Workstations", path: "OU=Lab Computers,DC=lab,DC=local" }
  - { name: "Servers", path: "OU=Lab Computers,DC=lab,DC=local" }

# Default lab user accounts — scenarios override or extend this list
ad_users: []

# DNS forwarders
ad_dns_forwarders:
  - "8.8.8.8"
  - "1.1.1.1"

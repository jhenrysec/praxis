# RHEL 9.5 Kickstart — automated install for Packer template build
# Delivered via OEMDRV CD — Anaconda auto-discovers /ks.cfg on this volume
# Paired with: packer/templates/rhel-9.pkr.hcl (tpl-rhel-9, VM ID 120)

# Install mode — text, use DVD as package source
text
cdrom

# Locale / keyboard / timezone
lang en_US.UTF-8
keyboard us
timezone America/New_York --utc

# Network — DHCP on primary link, hostname will be overridden by cloud-init
network --bootproto=dhcp --device=link --activate --onboot=on --hostname=rhel-template

# Accounts — ansible user gets passwordless sudo in %post
rootpw --plaintext LabAdmin2024!
user --name=ansible --password=ansible --plaintext --groups=wheel

# Disk — wipe sda, LVM autopart
bootloader --location=mbr --boot-drive=sda
ignoredisk --only-use=sda
clearpart --all --initlabel --drives=sda
autopart --type=lvm

# Security posture
firewall --enabled --service=ssh
services --enabled=sshd
selinux --enforcing

# No OOBE wizard — reboot and eject media when done
firstboot --disabled
reboot --eject

# Package set — minimal server + Ansible/cloud-init essentials
%packages
@^minimal-environment
@standard
openssh-server
sudo
python3
tar
rsync
-plymouth
-iwl*-firmware
%end

# Post-install configuration
%post --log=/root/ks-post.log
# Passwordless sudo for ansible — required for Packer/Ansible provisioning
echo "ansible ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/ansible
chmod 0440 /etc/sudoers.d/ansible

# SSH hardening — no root password login; key-based only if root needs in
sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin prohibit-password/' /etc/ssh/sshd_config
systemctl enable sshd

# Clear any post-install caches
dnf clean all
%end

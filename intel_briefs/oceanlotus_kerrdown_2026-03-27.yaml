# ── LAYER 1: ATTACK SCHEME OF MANEUVER ───────────────────────────────────────
attack_scheme:
  summary: >
    OceanLotus delivers the KerrDown downloader via two vectors: a malicious
    Office document containing VBA macros with embedded base64-encoded PE DLLs,
    or RAR archives containing a legitimate Microsoft Word executable that
    sideloads a malicious wwlib.dll. In both cases, the KerrDown DLL downloads
    an encrypted Cobalt Strike Beacon payload from a remote C2 server, decrypts
    it in memory, and executes it without writing the final payload to disk.
    The RAR variant adds multiple shellcode stages with UCL compression and AES
    encryption between the initial DLL load and the final Beacon execution.

  phases:
    - order: 1
      phase: Initial Access
      tactic_id: TA0001
      technique: T1566.001
      technique_name: "Phishing: Spearphishing Attachment"
      sub_technique: ""
      ics_technique: false
      adversary_action: >
        Delivered malicious MIME documents via spearphishing. Lure documents
        displayed Vietnamese-language content instructing the victim to enable
        macros. A second delivery vector used RAR archives with Vietnamese
        filenames (e.g., "Don khieu nai.rar" — "Complaint letter") containing
        a renamed legitimate Microsoft Word 2007 executable alongside a
        malicious wwlib.dll for DLL sideloading.
      why_it_worked: >
        Lure content was tailored to Vietnamese-speaking targets with
        contextually relevant filenames and social engineering messages.
        The use of legitimate Microsoft Word executables inside RAR files
        bypasses file-type based filtering.
      source_quote: ""
      lab_objective: >
        Student must craft or analyze a spearphishing delivery containing
        a macro-enabled Office document OR a RAR archive with a sideloading
        payload. For the blue team track, the student must identify the
        malicious attachment in email logs and extract the embedded payload.
      detection_opportunity: >
        Email gateway logs showing .doc/.rar attachments from external
        senders. Macro execution events in Office application logs.
        Suspicious child process spawned by WINWORD.EXE.
      detection_artifacts:
        - "Sysmon Event ID 1 — process creation: WINWORD.EXE spawning unexpected child"
        - "Sysmon Event ID 7 — image loaded: wwlib.dll loaded by renamed Word executable"
        - "Email gateway logs — .doc or .rar attachment with Vietnamese filename"
      fidelity_note: >
        Lab uses a crafted .doc with benign macro that simulates the
        KerrDown behavior (drops a marker file, calls out to lab C2)
        rather than actual malware.
      instructor_only: false

    - order: 2
      phase: Execution
      tactic_id: TA0002
      technique: T1204.002
      technique_name: "User Execution: Malicious File"
      sub_technique: ""
      ics_technique: false
      adversary_action: >
        Victim opens the lure document and enables macros as instructed by
        the Vietnamese-language prompt. In the RAR variant, victim double-clicks
        the executable file named to appear as a legitimate document
        ("Noi dung chi tiet don khieu nai gui cong ty.exe").
      why_it_worked: >
        Social engineering message in the victim's native language.
        The RAR variant uses a .exe extension disguised with a long
        Vietnamese filename that appears document-like. Windows default
        behavior hides file extensions for known types.
      lab_objective: >
        Student executes the lure document or sideloading package in the
        lab environment and observes the resulting process chain and
        network callbacks to the lab C2 server.
      detection_opportunity: >
        Process creation events showing macro-spawned processes.
        File write events for main_background.png in the user's
        AppData\Roaming directory.
      detection_artifacts:
        - "Sysmon Event ID 11 — file created: main_background.png in AppData\\Roaming"
        - "Sysmon Event ID 1 — process creation: rundll32.exe or regsvr32.exe spawned by WINWORD.EXE"
        - "Windows Security Event 4688 — new process creation with macro parent"
      instructor_only: false

    - order: 3
      phase: Defense Evasion
      tactic_id: TA0005
      technique: T1574.002
      technique_name: "Hijack Execution Flow: DLL Side-Loading"
      sub_technique: ""
      ics_technique: false
      adversary_action: >
        RAR variant packages a legitimate older Microsoft Word 2007
        executable alongside a malicious wwlib.dll. When the legitimate
        executable runs, it loads wwlib.dll from its own directory via
        the standard DLL search order, executing the KerrDown downloader
        code through the exported FMain function. This leverages a
        signed Microsoft binary to execute malicious code.
      why_it_worked: >
        Application whitelisting and endpoint protection tools trust
        signed Microsoft binaries. DLL sideloading via a legitimate
        application appears benign to most security products.
      lab_objective: >
        Student must identify the DLL sideloading technique by examining
        the RAR archive contents, recognizing the legitimate executable
        paired with an unexpected wwlib.dll, and tracing the execution
        chain through process monitoring.
      detection_opportunity: >
        Sysmon DLL load events showing wwlib.dll loaded from a
        non-standard path (not Program Files\Microsoft Office).
        Hash mismatch between the loaded wwlib.dll and known-good
        Microsoft wwlib.dll hashes.
      detection_artifacts:
        - "Sysmon Event ID 7 — image loaded: wwlib.dll from user-writable directory"
        - "Sysmon Event ID 1 — Microsoft Word executable running from Temp or Downloads"
        - "File hash mismatch: wwlib.dll SHA256 does not match any known Microsoft DLL"
      fidelity_note: >
        Lab replicates this exactly. A legitimate older Microsoft Word
        executable is provided alongside a custom wwlib.dll that performs
        benign C2 callback rather than actual malware operations.

    - order: 4
      phase: Defense Evasion
      tactic_id: TA0005
      technique: T1140
      technique_name: "Deobfuscate/Decode Files or Information"
      sub_technique: ""
      ics_technique: false
      adversary_action: >
        The macro variant embeds two base64-encoded PE DLLs directly in
        the document body as text content with font size set to 1 to
        hide them visually. A VBA function (reused from Motobit's public
        base64 decoder) selects the 32-bit or 64-bit DLL based on system
        architecture, decodes it, and writes it to disk. The RAR variant
        uses multi-stage deobfuscation: base64 decode, UCL decompression,
        then AES decryption across three shellcode stages.
      why_it_worked: >
        Embedding PE files as base64 text within the document body
        avoids detection by tools that scan OLE streams for embedded
        binaries. The multi-stage approach in the RAR variant means
        no single stage reveals the full payload to static analysis.
      lab_objective: >
        Student must extract and decode the base64 blobs from the
        document, identify the architecture check logic in the macro,
        and recover the embedded DLLs. For the RAR variant, student
        traces through the multi-stage decode chain.
      detection_opportunity: >
        Large base64 strings in Office document content. PowerShell
        or VBScript base64 decode operations. Multiple shellcode
        injection stages visible in memory forensics.
      detection_artifacts:
        - "YARA rule: base64-encoded MZ header (TVqQ) in document body"
        - "Sysmon Event ID 1 — certutil.exe or PowerShell with -decode arguments"
        - "Memory forensics: multiple RWX memory regions in Word process"

    - order: 5
      phase: Command and Control
      tactic_id: TA0011
      technique: T1071.001
      technique_name: "Application Layer Protocol: Web Protocols"
      sub_technique: ""
      ics_technique: false
      adversary_action: >
        KerrDown DLL downloads the final payload over HTTPS from the
        C2 server. URLs are architecture-specific: kuss32.gif for
        32-bit systems and kuss64.gif for 64-bit systems. Custom User-Agent
        strings identify the architecture to the C2 server. The payload
        is encrypted with DES and decrypted in memory before execution.
        Cobalt Strike Beacon then establishes its own C2 channel over
        HTTPS to a separate domain (b.cortanazone[.]com).
      why_it_worked: >
        HTTPS traffic blends with normal web browsing. The .gif
        extension on the payload URL makes it appear as an image
        download in proxy logs. Custom User-Agent strings are
        close enough to legitimate Firefox UAs to avoid filtering.
      lab_objective: >
        Student must capture and analyze the C2 callback traffic using
        Wireshark or a proxy. Must identify the architecture-specific
        URL pattern, the custom User-Agent string, and the subsequent
        Cobalt Strike Beacon C2 channel establishment.
      detection_opportunity: >
        Network monitoring showing HTTPS connections to dynamic DNS
        domains (servebbs.com, homelinux.com, webhop.info).
        Proxy logs showing .gif downloads with suspicious User-Agent
        strings. DNS queries for known OceanLotus C2 infrastructure.
      detection_artifacts:
        - "DNS query log: resolution of servebbs.com, cortanazone.com, browsersyn.com"
        - "Proxy/HTTP log: GET /kuss32.gif or /kuss64.gif with custom User-Agent"
        - "Zeek/Bro conn.log: HTTPS to dynamic DNS provider domains"
        - "Cobalt Strike Beacon malleable C2 profile indicators in TLS traffic"

    - order: 6
      phase: Execution
      tactic_id: TA0002
      technique: T1059.001
      technique_name: "Command and Scripting Interpreter: PowerShell"
      sub_technique: ""
      ics_technique: false
      adversary_action: >
        Cobalt Strike Beacon payload is loaded and executed entirely
        in memory. The Beacon provides the adversary with a full
        post-exploitation framework including command execution,
        lateral movement, credential harvesting, and data exfiltration
        capabilities. OceanLotus has been documented using Cobalt Strike
        extensively in their campaigns (ref: Operation Cobalt Kitty).
      why_it_worked: >
        In-memory execution leaves no payload on disk for AV to scan.
        Cobalt Strike is a legitimate penetration testing tool, so
        its behavioral signatures may be whitelisted in some environments.
      lab_objective: >
        Student must detect the in-memory Cobalt Strike Beacon through
        behavioral analysis: identifying the named pipe communication,
        the sleep/jitter pattern in C2 callbacks, and the Beacon
        configuration extracted from memory.
      detection_opportunity: >
        Named pipe creation events. Periodic HTTPS callbacks with
        consistent jitter patterns. Cobalt Strike default named
        pipe patterns (\\.\pipe\msagent_*).
      detection_artifacts:
        - "Sysmon Event ID 17/18 — pipe created/connected: msagent_* pattern"
        - "Network: periodic HTTPS POST to /submit.php or Beacon default URIs"
        - "Memory: Cobalt Strike configuration block at known offsets"
        - "Windows Defender/ETW: suspicious .NET assembly load in non-.NET process"
      fidelity_note: >
        Lab uses actual Cobalt Strike Team Server (licensed for authorized
        training). Beacon configuration mirrors the source report:
        HTTPS C2, sleep 60s with 10% jitter.

  constraints:
    prohibited:
      - "Using commodity RATs (AsyncRAT, NjRAT) — OceanLotus exclusively used custom tooling plus Cobalt Strike"
      - "Noisy port scanning during initial access — this is a targeted spearphishing campaign, not a spray-and-pray attack"
    required_conditions:
      - "Spearphishing must be the initial access vector — no exploitation of public-facing services"
      - "DLL sideloading must use a legitimate signed Microsoft executable — not a custom dropper"
      - "Final payload must execute in memory — no on-disk persistence of Cobalt Strike"
      - "C2 must use HTTPS — not raw TCP or DNS tunneling"

# ── LAYER 2: TOPOLOGY CONTEXT ─────────────────────────────────────────────────
topology_context:
  available_in_source: false

  sector: government
  subsector: ""
  environment_description: >
    The source does not describe a specific victim network topology.
    OceanLotus targets are primarily Vietnamese-speaking individuals and
    organizations across government, media, human rights, and private
    sector industries. The attack chain is workstation-focused: initial
    compromise of an end-user Windows workstation via spearphishing,
    followed by C2 establishment and post-exploitation. A typical target
    environment would include a corporate Windows domain with internet-facing
    email, workstations with Microsoft Office, and standard egress filtering.

  critical_topology_facts:
    - "Attack chain begins at the workstation — email delivery to an end user"
    - "Requires outbound HTTPS from the workstation to the internet (C2 callback)"
    - "DLL sideloading requires the ability to execute files from user-writable directories"
    - "No lateral movement documented in this specific report — KerrDown is the initial foothold tool"
    - "Post-exploitation via Cobalt Strike implies the adversary intends to move laterally after establishing the Beacon"

  what_made_it_vulnerable:
    - condition: "Users able to enable Office macros"
      enables: "Execution of embedded VBA code to decode and drop KerrDown DLL"
      lab_implementation: >
        Windows 10 workstation with Microsoft Office installed.
        Macro security set to 'Disable with notification' (default) —
        user must click Enable Content. This is the realistic setting.
      is_misconfiguration: false

    - condition: "Users able to execute files from archives"
      enables: "DLL sideloading via legitimate Microsoft Word executable in RAR"
      lab_implementation: >
        Windows 10 workstation with default execution policy.
        7-Zip or WinRAR installed for archive extraction.
        No application whitelisting enforced.
      is_misconfiguration: false

    - condition: "Outbound HTTPS permitted from workstations"
      enables: "KerrDown C2 callback and Cobalt Strike Beacon establishment"
      lab_implementation: >
        pfSense rule: PERMIT TCP/443 from workstation subnet to
        lab C2 server. No SSL inspection — mirrors most real
        environments where HTTPS is permitted outbound.
      is_misconfiguration: false

  network_zones_present: [corporate_IT, internet]

  lab_zone_mapping:
    - source_zone: corporate_IT
      lab_bridge: vmbr2
      ip_range: "10.10.2.0/24"
      notes: "Windows domain with workstation and DC — attack surface"
    - source_zone: internet
      lab_bridge: vmbr1
      ip_range: "10.10.1.0/24"
      notes: "Attacker platform with Cobalt Strike Team Server — simulates internet-facing C2"

  topology_requirements:
    - requirement: "Workstation must reach attacker C2 over HTTPS"
      implements_as:
        type: pfSense_rule
        detail: "PERMIT TCP/443 from 10.10.2.30 (workstation) to 10.10.1.10 (attacker/C2)"
      rationale: "KerrDown downloads payload over HTTPS; Beacon maintains C2 over HTTPS"
      is_misconfiguration: false

    - requirement: "Domain controller on same segment as workstation"
      implements_as:
        type: bridge_config
        detail: "DC and workstation both on vmbr2, same subnet"
      rationale: "Post-exploitation lateral movement target after Beacon establishment"
      is_misconfiguration: false

    - requirement: "Mail delivery simulation to workstation"
      implements_as:
        type: vm_config
        detail: >
          Lure document pre-staged on workstation desktop or delivered
          via hMailServer on DC. Simulates email delivery without
          requiring full email infrastructure.
      rationale: "Initial access vector is spearphishing attachment"
      is_misconfiguration: false


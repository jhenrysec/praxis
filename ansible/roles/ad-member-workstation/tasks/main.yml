---
# ansible/roles/ad-member-workstation/tasks/main.yml
# Joins a Windows VM to the lab.local domain.
# Requires: DC must be deployed and reachable first.

- name: "[AD-MEMBER] Set DNS to domain controller"
  ansible.windows.win_dns_client:
    adapter_names: "*"
    dns_servers:
      - "{{ ad_dc_ip | default(hostvars[groups['domain_controllers'][0]]['ansible_host'] | default(groups['domain_controllers'][0])) }}"
  when: ad_dc_ip is defined or (groups['domain_controllers'] is defined and groups['domain_controllers'] | length > 0)

- name: "[AD-MEMBER] Join domain"
  microsoft.ad.membership:
    dns_domain_name: "{{ ad_domain_name }}"
    domain_admin_user: "{{ ad_domain_admin }}@{{ ad_domain_name }}"
    domain_admin_password: "{{ ad_domain_admin_password }}"
    domain_ou_path: "{{ ad_computer_ou }}"
    state: domain
  register: domain_join
  notify: reboot_after_join

- name: "[AD-MEMBER] Flush handlers — reboot after join"
  ansible.builtin.meta: flush_handlers

- name: "[AD-MEMBER] Create local admin account"
  ansible.windows.win_user:
    name: "{{ local_admin_user }}"
    password: "{{ local_admin_password }}"
    groups:
      - Administrators
    state: present
    password_never_expires: true
  no_log: true

- name: "[AD-MEMBER] Configure credential caching"
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon
    name: CachedLogonsCount
    data: "{{ cached_logons_count }}"
    type: string

- name: "[AD-MEMBER] Enable network discovery"
  ansible.windows.win_shell: |
    Get-NetFirewallRule -DisplayGroup "Network Discovery" | Enable-NetFirewallRule
  ignore_errors: true

- name: "[AD-MEMBER] Enable file and printer sharing"
  ansible.windows.win_shell: |
    Get-NetFirewallRule -DisplayGroup "File and Printer Sharing" | Enable-NetFirewallRule
  ignore_errors: true

- name: "[AD-MEMBER] Verify domain membership"
  ansible.windows.win_shell: |
    $cs = Get-CimInstance Win32_ComputerSystem
    Write-Host "Domain: $($cs.Domain)"
    Write-Host "PartOfDomain: $($cs.PartOfDomain)"
  register: domain_verify
  changed_when: false

- name: "[AD-MEMBER] Display domain status"
  ansible.builtin.debug:
    msg: "{{ domain_verify.stdout_lines }}"

# SCEN-001 SCADA Modbus Recon — Ansible Inventory
# Slot 1 deployment — IPs from Terraform output

[attackers]
kali-attacker-s1 ansible_host=10.10.1.10

[openplc]
openplc-01-s1 ansible_host=192.168.101.10

[historian]
historian-s1 ansible_host=192.168.101.20

[scada:children]
openplc
historian

[linux:children]
attackers
scada

[linux:vars]
ansible_connection=ssh
ansible_user=ansible
ansible_ssh_private_key_file=~/.ssh/lab_key

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

---
# ansible/roles/common-windows/tasks/main.yml
# Base configuration for all Windows VMs in the lab.

- name: "[WIN-COMMON] Set timezone"
  community.windows.win_timezone:
    timezone: "{{ win_timezone }}"

- name: "[WIN-COMMON] Ensure WinRM is configured for Ansible"
  ansible.windows.win_shell: |
    Set-Item -Path WSMan:\localhost\Service\AllowUnencrypted -Value $true
    Set-Item -Path WSMan:\localhost\Service\Auth\Basic -Value $true
    Set-Item -Path WSMan:\localhost\MaxEnvelopeSizekb -Value {{ winrm_max_envelope_kb }}

- name: "[WIN-COMMON] Set PowerShell execution policy via registry"
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell
    name: ExecutionPolicy
    data: RemoteSigned
    type: string

- name: "[WIN-COMMON] Enable RDP"
  ansible.windows.win_regedit:
    path: HKLM:\System\CurrentControlSet\Control\Terminal Server
    name: fDenyTSConnections
    data: 0
    type: dword

- name: "[WIN-COMMON] Enable RDP firewall rule"
  community.windows.win_firewall_rule:
    name: "Remote Desktop"
    localport: 3389
    protocol: tcp
    direction: in
    action: allow
    state: present
    enabled: true

- name: "[WIN-COMMON] Ensure firewall rules for lab services"
  community.windows.win_firewall_rule:
    name: "{{ item.name }}"
    localport: "{{ item.localport }}"
    protocol: "{{ item.protocol }}"
    direction: "{{ item.direction }}"
    action: "{{ item.action }}"
    state: present
    enabled: true
  loop: "{{ win_firewall_rules }}"

- name: "[WIN-COMMON] Install common Windows features"
  ansible.windows.win_feature:
    name: "{{ win_common_features }}"
    state: present
  register: win_features
  notify: reboot_if_pending

- name: "[WIN-COMMON] Disable Windows Update auto-restart"
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
    name: "{{ item.name }}"
    data: "{{ item.data }}"
    type: dword
  loop:
    - { name: "NoAutoRebootWithLoggedOnUsers", data: 1 }
    - { name: "AUOptions", data: 2 }

- name: "[WIN-COMMON] Disable Server Manager auto-launch"
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\ServerManager
    name: DoNotOpenServerManagerAtLogon
    data: 1
    type: dword

- name: "[WIN-COMMON] Set computer description"
  ansible.windows.win_shell: |
    $desc = "Lab VM — {{ inventory_hostname }} — {{ lab_org }}"
    Set-CimInstance -Query "SELECT * FROM Win32_OperatingSystem" -Property @{Description=$desc}
  when: inventory_hostname is defined

    domain: "lab.local"
    netbios: "LAB"
    ous:
      - "OU=Staff,DC=lab,DC=local"
      - "OU=IT,DC=lab,DC=local"
      - "OU=Service_Accounts,DC=lab,DC=local"
    users:
      - sam_account_name: n.vanminh

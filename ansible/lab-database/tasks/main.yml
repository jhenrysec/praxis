# ansible/roles/lab-database/tasks/main.yml
# Installs PostgreSQL 16 on the management host and creates the labportal database
# Generated by: INFRA_AGENT during /portal-build Phase 11
# Updated: see CHANGELOG.md

---
- name: "[LAB-DB] Install PostgreSQL 16 apt repository key"
  ansible.builtin.apt_key:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present

- name: "[LAB-DB] Add PostgreSQL 16 apt repository"
  ansible.builtin.apt_repository:
    repo: "deb http://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    state: present
    filename: pgdg

- name: "[LAB-DB] Install PostgreSQL 16"
  ansible.builtin.apt:
    name:
      - postgresql-16
      - postgresql-client-16
      - python3-psycopg2
    state: present
    update_cache: true

- name: "[LAB-DB] Ensure PostgreSQL service is running"
  ansible.builtin.systemd:
    name: postgresql
    state: started
    enabled: true

- name: "[LAB-DB] Create labportal database user"
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: labportal
    password: "{{ db_password }}"
    state: present
  no_log: true

- name: "[LAB-DB] Create labportal database"
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: labportal
    owner: labportal
    encoding: UTF-8
    state: present

- name: "[LAB-DB] Grant all privileges on labportal database"
  become: true
  become_user: postgres
  community.postgresql.postgresql_privs:
    db: labportal
    role: labportal
    privs: ALL
    type: database
    state: present

- name: "[LAB-DB] Configure pg_hba.conf for local connections"
  ansible.builtin.lineinfile:
    path: /etc/postgresql/16/main/pg_hba.conf
    regexp: "^local\\s+all\\s+labportal"
    line: "local   labportal   labportal                  md5"
    insertafter: "^# TYPE"
  notify: restart_postgresql

- name: "[LAB-DB] Verify database connection"
  ansible.builtin.command:
    cmd: psql -U labportal -d labportal -c "SELECT 1"
  environment:
    PGPASSWORD: "{{ db_password }}"
  register: db_check
  changed_when: false

- name: "[LAB-DB] Report database status"
  ansible.builtin.debug:
    msg: "✅ labportal database is accessible"
  when: db_check.rc == 0

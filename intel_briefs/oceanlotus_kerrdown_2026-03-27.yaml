# ── LAYER 4: IOC AND ARTIFACT CATALOG ────────────────────────────────────────
ioc_catalog:
  available_in_source: true

  artifacts:
    - id: IOC-001
      type: filesystem_artifact
      host_role: victim_workstation
      description: >
        KerrDown DLL dropped as main_background.png in the user's
        AppData\Roaming directory. Despite the .png extension, this
        is a PE DLL file. Presence of an MZ header in a .png file
        is a strong indicator of compromise.
      source_detail: "DLL dropped at Users\\Administrator\\AppData\\Roaming\\main_background.png"

      staging:
        method: file_drop
        ansible_role: stage-windows-artifacts
        file_path: "C:\\Users\\labuser\\AppData\\Roaming\\main_background.png"
        file_source: "artifacts/oceanlotus_kerrdown/main_background_sim.dll"
        pre_scenario: true

      detection_value: >
        Tests ability to identify PE files masquerading as image files.
        Students must check file headers vs. file extensions during
        forensic triage. Foundational digital forensics skill.
      intentional: false
      difficulty: easy
      hint_available: true

